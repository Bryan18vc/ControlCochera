<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Control de Cochera</title>
  
  <!-- Configuración para que funcione como App nativa en iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mi Cochera">
  
  <style>
    :root {
      --bg: #f2f2f7;
      --card: #ffffff;
      --primary: #007aff;
      --green: #34c759;
      --red: #ff3b30;
      --text: #1c1c1e;
      --muted: #8e8e93;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 20px 16px 40px; background: var(--bg); color: var(--text); -webkit-tap-highlight-color: transparent; }
    h1 { font-size: 24px; margin: 10px 0 16px; text-align: center; }
    
    .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    
    .header-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .header-controls button { background: var(--bg); border: none; padding: 8px 14px; border-radius: 10px; font-weight: 600; font-size: 16px; cursor: pointer; }
    .month-title { font-size: 18px; font-weight: 700; text-transform: capitalize; }

    .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .input-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
    .input-group input { width: 100%; padding: 10px; border: 1px solid #d1d1d6; border-radius: 10px; font-size: 16px; font-weight: 600; }

    .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
    .stat-box { background: var(--bg); padding: 12px 8px; border-radius: 12px; }
    .stat-val { font-size: 18px; font-weight: 800; display: block; }
    .stat-lbl { font-size: 11px; color: var(--muted); }
    .total-pay { grid-column: span 3; background: #e5f1ff; color: var(--primary); padding: 14px; border-radius: 12px; margin-top: 4px; }
    .total-pay .stat-val { font-size: 24px; }

    .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 8px; }
    .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
    .day { aspect-ratio: 1; border-radius: 12px; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 600; font-size: 15px; cursor: pointer; user-select: none; transition: transform 0.1s; }
    .day:active { transform: scale(0.92); }
    .day.empty { background: transparent; cursor: default; }
    .day.parked { background: var(--green); color: white; }
    .day.skipped { background: var(--red); color: white; }
    .day.today { border: 2px solid var(--primary); }
    .day span.icon { font-size: 11px; margin-top: 2px; }

    .legend { display: flex; justify-content: center; gap: 16px; font-size: 12px; color: var(--muted); margin-top: 14px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 4px; }
  </style>
</head>
<body>

  <h1>🚗 Control de Cochera</h1>

  <!-- Configuración de Tarifas -->
  <div class="card config-grid">
    <div class="input-group">
      <label>Pago Mensual (S/)</label>
      <input type="number" id="monthlyFee" value="200" onchange="saveConfig()">
    </div>
    <div class="input-group">
      <label>Descuento x Día (S/)</label>
      <input type="number" id="dailyDiscount" value="6.50" step="0.5" onchange="saveConfig()">
    </div>
  </div>

  <!-- Resumen del Mes -->
  <div class="card">
    <div class="summary-grid">
      <div class="stat-box">
        <span class="stat-val" id="countParked" style="color: var(--green);">0</span>
        <span class="stat-lbl">Días Guardado</span>
      </div>
      <div class="stat-box">
        <span class="stat-val" id="countSkipped" style="color: var(--red);">0</span>
        <span class="stat-lbl">No Guardado</span>
      </div>
      <div class="stat-box">
        <span class="stat-val" id="totalDiscount" style="color: var(--red);">-S/ 0</span>
        <span class="stat-lbl">Descuento</span>
      </div>
      <div class="total-pay">
        <span class="stat-lbl" style="color: var(--primary); font-weight:600;">NETO A PAGAR ESTE MES</span>
        <span class="stat-val" id="netPay">S/ 200.00</span>
      </div>
    </div>
  </div>

  <!-- Calendario -->
  <div class="card">
    <div class="header-controls">
      <button onclick="changeMonth(-1)">◀</button>
      <div class="month-title" id="monthLabel">Octubre 2026</div>
      <button onclick="changeMonth(1)">▶</button>
    </div>
    <div class="weekdays">
      <div>Dom</div><div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div>
    </div>
    <div class="calendar" id="calendarGrid"></div>
    <div class="legend">
      <div><span class="dot" style="background:var(--green)"></span>Guardado (1 toque)</div>
      <div><span class="dot" style="background:var(--red)"></span>No guardado (2 toques)</div>
    </div>
  </div>

  <script>
    let currentDate = new Date();
    let records = JSON.parse(localStorage.getItem('cochera_records') || '{}');
    let config = JSON.parse(localStorage.getItem('cochera_config') || '{"monthly": 200, "discount": 6.5}');

    document.getElementById('monthlyFee').value = config.monthly;
    document.getElementById('dailyDiscount').value = config.discount;

    function saveConfig() {
      config.monthly = parseFloat(document.getElementById('monthlyFee').value) || 0;
      config.discount = parseFloat(document.getElementById('dailyDiscount').value) || 0;
      localStorage.setItem('cochera_config', JSON.stringify(config));
      updateSummary();
    }

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      renderCalendar();
    }

    function toggleDay(dateKey) {
      const current = records[dateKey];
      if (!current) records[dateKey] = 'parked';
      else if (current === 'parked') records[dateKey] = 'skipped';
      else delete records[dateKey];

      localStorage.setItem('cochera_records', JSON.stringify(records));
      renderCalendar();
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      
      const monthNames = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
      document.getElementById('monthLabel').innerText = `${monthNames[month]} ${year}`;

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const today = new Date();

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('div');
        empty.className = 'day empty';
        grid.appendChild(empty);
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const status = records[dateKey];
        const cell = document.createElement('div');
        cell.className = 'day';
        if (status) cell.classList.add(status);
        if (d === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
          cell.classList.add('today');
        }

        let icon = status === 'parked' ? '✓' : (status === 'skipped' ? '✕' : '');
        cell.innerHTML = `<span>${d}</span><span class="icon">${icon}</span>`;
        cell.onclick = () => toggleDay(dateKey);
        grid.appendChild(cell);
      }

      updateSummary();
    }

    function updateSummary() {
      const year = currentDate.getFullYear();
      const month = String(currentDate.getMonth() + 1).padStart(2, '0');
      const prefix = `${year}-${month}-`;

      let parked = 0, skipped = 0;
      for (const [key, val] of Object.entries(records)) {
        if (key.startsWith(prefix)) {
          if (val === 'parked') parked++;
          if (val === 'skipped') skipped++;
        }
      }

      const discountTotal = skipped * config.discount;
      const net = Math.max(0, config.monthly - discountTotal);

      document.getElementById('countParked').innerText = parked;
      document.getElementById('countSkipped').innerText = skipped;
      document.getElementById('totalDiscount').innerText = `-S/ ${discountTotal.toFixed(2)}`;
      document.getElementById('netPay').innerText = `S/ ${net.toFixed(2)}`;
    }

    renderCalendar();
  </script>
</body>
</html>
